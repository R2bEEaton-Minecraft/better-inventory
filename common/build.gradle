plugins { id "com.gradleup.shadow" }

architectury { common("fabric") }

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	implementation "dev.architectury:architectury:${rootProject.architectury_version}"
	testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.assertj:assertj-core:${rootProject.assertj_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

jar { archiveClassifier = "raw" }
java { withSourcesJar() }
